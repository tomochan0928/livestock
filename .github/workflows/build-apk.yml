name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Ensure HTML is in assets
      run: |
        mkdir -p app/src/main/assets/www
        if [ -f livestock_health_v5.html ]; then
          cp livestock_health_v5.html app/src/main/assets/www/
        fi
        if [ ! -f app/src/main/assets/www/livestock_health_v5.html ]; then
          echo "ERROR: HTML file not found"
          exit 1
        fi
        echo "HTML size: $(wc -c < app/src/main/assets/www/livestock_health_v5.html) bytes"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.4

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Rename APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk \
           livestock-health-v5.apk

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: livestock-health-v5
        path: livestock-health-v5.apk
        retention-days: 90

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: "v${{ github.run_number }}"
        name: "家畜健康管理 APK (Build ${{ github.run_number }})"
        body: |
          ## 家畜健康管理 Android APK

          livestock_health_v5.html をAndroidアプリとしてパッケージ化したものです。

          ### インストール方法
          1. `livestock-health-v5.apk` をダウンロード
          2. Androidスマートフォンへ転送
          3. 「提供元不明のアプリ」を許可してインストール

          ### 特徴
          - 完全オフライン動作
          - データはスマートフォン内に保存（localStorage）
          - カメラ・バーコードスキャン対応
        files: livestock-health-v5.apk
        token: ${{ secrets.GITHUB_TOKEN }}
